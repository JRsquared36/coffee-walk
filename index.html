<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover lets the sheet extend under the iPhone home bar; CSS adds padding there. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Coffee Walk</title>
  <!-- Fonts from Google Fonts. If they fail to load, tokens.css falls back to fonts already on the device. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main class="layout">
    <div id="map" class="map" aria-label="Map"></div>

    <!-- On phones this panel is a bottom sheet over the map; on wide screens it's a sidebar.
         data-view decides which of the three views below is showing: setup, walk or detail. -->
    <section id="panel" class="panel" data-view="setup" aria-label="Coffee walk planner">
      <button id="sheet-handle" class="sheet-handle" type="button" aria-label="Resize panel"><span class="sheet-handle-bar"></span></button>

      <div class="panel-content">
        <p id="status-message" class="status" role="status" aria-live="polite"></p>

        <div class="view view--setup">
          <header class="intro">
            <h1>Coffee Walk</h1>
            <p class="text-secondary">A walking loop through coffee shops near you.</p>
          </header>
          <div class="chip-group" role="radiogroup" aria-labelledby="stop-count-label">
            <span id="stop-count-label" class="label">Stops</span>
            <label class="chip"><input type="radio" name="stop-count" value="3"><span>3</span></label>
            <label class="chip"><input type="radio" name="stop-count" value="4" checked><span>4</span></label>
            <label class="chip"><input type="radio" name="stop-count" value="5"><span>5</span></label>
          </div>
          <button id="start-walk-button" type="button" class="button button--primary button--block">Start a coffee walk</button>
          <p class="caption">We'll ask for your location to find coffee shops nearby.</p>
        </div>

        <section id="walk-section" class="view view--walk">
          <div class="walk-header">
            <div class="walk-titles">
              <h2>Your walk</h2>
              <p id="walk-totals" class="caption"></p>
            </div>
            <button id="new-route-button" type="button" class="button button--secondary">New route</button>
          </div>
          <ol id="stop-list" class="stop-list"></ol>
          <p id="route-source-note" class="caption"></p>
          <button id="start-over-button" type="button" class="button button--quiet button--block">Start over</button>
        </section>

        <section id="cafe-detail" class="view view--detail" aria-label="Café details"></section>

        <section class="log-section">
          <h2>My coffee log</h2>
          <p id="empty-log-message" class="caption">No check-ins yet. Tap "I'm here" at a stop to log it.</p>
          <ul id="log-list" class="log-list"></ul>
        </section>
      </div>
    </section>
  </main>

  <dialog id="check-in-dialog">
    <form id="check-in-form" method="dialog">
      <h2 id="check-in-cafe-name"></h2>
      <fieldset class="star-rating">
        <legend class="label">Your rating</legend>
        <div class="stars">
          <label class="star"><input type="radio" name="rating" value="1" required><span class="star-glyph" aria-hidden="true">★</span><span class="visually-hidden">1 star</span></label>
          <label class="star"><input type="radio" name="rating" value="2"><span class="star-glyph" aria-hidden="true">★</span><span class="visually-hidden">2 stars</span></label>
          <label class="star"><input type="radio" name="rating" value="3"><span class="star-glyph" aria-hidden="true">★</span><span class="visually-hidden">3 stars</span></label>
          <label class="star"><input type="radio" name="rating" value="4"><span class="star-glyph" aria-hidden="true">★</span><span class="visually-hidden">4 stars</span></label>
          <label class="star"><input type="radio" name="rating" value="5"><span class="star-glyph" aria-hidden="true">★</span><span class="visually-hidden">5 stars</span></label>
        </div>
      </fieldset>
      <div class="field">
        <label for="check-in-note" class="label">Note (optional)</label>
        <textarea id="check-in-note" class="text-field" maxlength="500" rows="3" placeholder="Oat flat white, great window seat"></textarea>
      </div>
      <p id="check-in-error" class="error" role="alert"></p>
      <div class="dialog-buttons">
        <button type="submit" id="save-check-in-button" class="button button--primary button--block">Check in</button>
        <button type="button" id="cancel-check-in-button" class="button button--quiet button--block">Cancel</button>
      </div>
    </form>
  </dialog>
</body>
</html>
