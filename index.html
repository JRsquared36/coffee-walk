<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee Walk</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main class="layout">
    <section class="panel" aria-label="Coffee walk planner">
      <header>
        <h1>Coffee Walk</h1>
        <p class="tagline">A walking loop through cafés near you.</p>
      </header>

      <div class="controls">
        <label for="stop-count">Stops</label>
        <select id="stop-count">
          <option value="3">3</option>
          <option value="4" selected>4</option>
          <option value="5">5</option>
        </select>
        <button id="start-walk-button" type="button" class="primary">Start a coffee walk</button>
      </div>

      <p id="status-message" class="status" role="status" aria-live="polite"></p>

      <section id="walk-section" hidden>
        <div class="walk-summary">
          <h2>Your walk</h2>
          <p id="walk-totals"></p>
          <button id="new-route-button" type="button">New route</button>
        </div>
        <ol id="stop-list" class="stop-list"></ol>
        <p id="route-source-note" class="fine-print"></p>
      </section>

      <section class="log-section">
        <h2>My coffee log</h2>
        <p id="empty-log-message" class="fine-print">No check-ins yet. Tap "I'm here" at a stop to log it.</p>
        <ul id="log-list" class="log-list"></ul>
      </section>
    </section>

    <div id="map" class="map" aria-label="Map"></div>
  </main>

  <dialog id="check-in-dialog">
    <form id="check-in-form" method="dialog">
      <h2 id="check-in-cafe-name"></h2>
      <fieldset class="rating-picker">
        <legend>Rating</legend>
        <label><input type="radio" name="rating" value="1" required> 1★</label>
        <label><input type="radio" name="rating" value="2"> 2★</label>
        <label><input type="radio" name="rating" value="3"> 3★</label>
        <label><input type="radio" name="rating" value="4"> 4★</label>
        <label><input type="radio" name="rating" value="5"> 5★</label>
      </fieldset>
      <label for="check-in-note">Note (optional)</label>
      <textarea id="check-in-note" maxlength="500" rows="3" placeholder="Oat flat white, great window seat"></textarea>
      <p id="check-in-error" class="error" role="alert"></p>
      <div class="dialog-buttons">
        <button type="button" id="cancel-check-in-button">Cancel</button>
        <button type="submit" id="save-check-in-button" class="primary">Check in</button>
      </div>
    </form>
  </dialog>
</body>
</html>
